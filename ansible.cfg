# Configuración de Ansible para este proyecto.
# Se aplica al ejecutar ansible / ansible-playbook desde esta carpeta.

[defaults]
# Inventario por defecto: pruebas. Para producción hay que indicarlo:
#   ansible-playbook -i inventory/produccion/hosts.ini playbooks/...
inventory = inventory/test/hosts.ini

# Detecta Python en el servidor sin mostrar avisos
interpreter_python = auto_silent

# Salida más legible de los resultados
callback_result_format = yaml

[ssh_connection]
# Menos conexiones SSH por tarea -> ejecuciones más rápidas
pipelining = True
