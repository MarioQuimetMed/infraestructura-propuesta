---
# Firewall y SSH del entorno de PRODUCCIÓN. Lo usa playbooks/acceso.yml.

# false: se puede entrar por SSH desde la VPN y desde acceso_ssh_origenes.
# true:  solo se puede entrar por la VPN.
#
# Se pasa a true en dos pasos, para no quedarte fuera:
#   1. Conéctate a la VPN, ejecuta .\ansible produccion conectar 10.60.0.1 TU_USUARIO
#      y aplica con false.
#   2. Cambia a true y vuelve a aplicar. Sin el paso 1, el playbook se detiene.
acceso_ssh_solo_vpn: false

# Desde dónde se permite SSH mientras acceso_ssh_solo_vpn sea false.
# Sustituye RED_LOCAL por la red de tu casa u oficina, por ejemplo 192.168.1.0/24.
# No uses "any": dejaría SSH abierto a todo Internet si el router lo redirige.
acceso_ssh_origenes:
  - RED_LOCAL
