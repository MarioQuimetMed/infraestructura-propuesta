# Gestionado por Ansible. Los cambios hechos a mano se perderán.

# Nadie entra directamente como root: cada persona usa su cuenta, y así queda
# registrado quién hizo qué.
PermitRootLogin no

# Solo se entra con clave SSH. Una contraseña se puede adivinar; una clave, no.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes

# Solo pueden entrar los miembros de este grupo.
AllowGroups ssh-access

# Registra también qué clave usó cada persona al entrar.
LogLevel VERBOSE

# Corta la conexión tras 3 intentos fallidos.
MaxAuthTries 3

# Este servidor no tiene interfaz gráfica.
X11Forwarding no
