# Gestionado por Ansible. Los cambios hechos a mano se perderán.

# Solo acepta conexiones desde el propio servidor.
listen_addresses = 'localhost'

# Guarda las contraseñas con el método más seguro disponible.
password_encryption = 'scram-sha-256'

# Registra quién se conecta y cuándo. Estos logs se ven en Grafana.
log_connections = on
log_disconnections = on
